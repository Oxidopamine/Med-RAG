name: CI

on:
  pull_request:
  # Every branch, not just main. Feature work here runs long and lands in one merge, so
  # gating CI on a pull request meant the branch carrying the serving path, the
  # presentation layer and the workspace rebuild reached 33 commits without ever being
  # built. A branch push is the event that should have caught the stale API contract.
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# A same-repo pull request fires both `push` and `pull_request`; cancelling superseded
# runs per ref keeps that from queueing work nobody will read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    # The immutability triggers that enforce release and evidence immutability exist only
    # in the Alembic migrations, so a SQLite-only suite cannot execute them. A trigger
    # that contradicted the repository layer therefore reached main and blocked every
    # index attestation. Tests under apps/api/tests/migrations skip without this service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medrag
          POSTGRES_PASSWORD: medrag
          POSTGRES_DB: medrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medrag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install API dependencies
        run: python -m pip install -e "./apps/api[dev,analysis,generation-gemini]"
      - name: Lint API
        run: python -m ruff check apps/api
      - name: Apply database migrations
        run: python -m alembic -c apps/api/alembic.ini upgrade head
      - name: Test API safety core
        run: python -m pytest apps/api/tests -q
      # The README and docs restate numbers produced by runs under benchmarks/results/.
      # Duplication there is deliberate; silent divergence is not, so it is a build failure.
      # The checker never runs pytest itself (it would nest four collections in one CI
      # run), so the collected count is taken here and handed to it for comparison with
      # the count the README states.
      - name: Verify stated figures against the published runs and the test count
        run: |
          collected=$(python -m pytest apps/api/tests --collect-only -q | tail -1 | awk '{print $1}')
          python scripts/check_readme_figures.py --collected-tests "$collected"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install API contract dependencies
        run: python -m pip install -e ./apps/api
      - name: Install web dependencies
        run: npm ci
      - name: Verify generated API contract
        run: |
          npm run generate:api-types
          git diff --exit-code -- apps/web/openapi.json apps/web/lib/generated/api-schema.d.ts
      - name: Lint web
        run: npm run lint:web
      - name: Type-check web
        run: npm run typecheck:web
      - name: Test web
        run: npm run test:web
      - name: Build web
        run: npm run build:web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Test web end to end
        run: npm run test:e2e:web
      - name: Keep end-to-end failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
