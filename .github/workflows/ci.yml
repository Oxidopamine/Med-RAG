name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install API dependencies
        run: python -m pip install -e "./apps/api[dev]"
      - name: Lint API
        run: python -m ruff check apps/api
      - name: Test API safety core
        run: python -m pytest apps/api/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install API contract dependencies
        run: python -m pip install -e ./apps/api
      - name: Install web dependencies
        run: npm ci
      - name: Verify generated API contract
        run: |
          npm run generate:api-types
          git diff --exit-code -- apps/web/openapi.json apps/web/lib/generated/api-schema.d.ts
      - name: Lint web
        run: npm run lint:web
      - name: Type-check web
        run: npm run typecheck:web
      - name: Test web
        run: npm run test:web
      - name: Build web
        run: npm run build:web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Test web end to end
        run: npm run test:e2e:web
