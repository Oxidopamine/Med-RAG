name: med-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medrag
      POSTGRES_USER: medrag
      POSTGRES_PASSWORD: medrag
    ports:
      - "5432:5432"
    volumes:
      - medrag-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrag -d medrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - medrag-qdrant:/qdrant/storage

  # --- Compatibility benchmark only. Not part of the default stack. ---
  # Started explicitly with `docker compose --profile qdrant-compat up -d`.
  # Storage is deliberately container-local (no volume) so every run starts
  # from empty state and exercises collection creation rather than reuse.
  # These services evaluate the roadmap's 1.15.4-vs-1.19.x question; they do
  # not change the pin the serving path runs on.
  qdrant-compat-baseline:
    image: qdrant/qdrant:v1.15.4
    profiles: ["qdrant-compat"]
    ports:
      - "6343:6333"

  qdrant-compat-candidate:
    image: qdrant/qdrant:v1.19.0
    profiles: ["qdrant-compat"]
    ports:
      - "6344:6333"

volumes:
  medrag-postgres:
  medrag-qdrant:
