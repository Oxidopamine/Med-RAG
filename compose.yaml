name: med-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medrag
      POSTGRES_USER: medrag
      POSTGRES_PASSWORD: medrag
    ports:
      - "5432:5432"
    volumes:
      - medrag-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrag -d medrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - medrag-qdrant:/qdrant/storage

volumes:
  medrag-postgres:
  medrag-qdrant:

