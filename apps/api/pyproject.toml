[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guideline-evidence-api"
version = "0.1.0"
description = "Fail-closed API foundation for Guideline Evidence QA"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.25,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
retrieval = [
  "sentencepiece>=0.2,<1",
  "torch>=2.5,<3",
  "transformers>=4.51,<6"
]
generation-bedrock = [
  "anthropic>=1,<2",
  "boto3>=1.35,<2"
]
generation-vertex = [
  "anthropic[vertex]>=1,<2"
]
generation-gemini = [
  "google-genai>=2,<3"
]
cpu-optimized = [
  "nncf>=2.14,<3",
  "openvino>=2025.0,<2027",
  "optimum-intel[openvino]>=1.22,<2"
]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1"
]

[project.scripts]
corpus-steward = "app.corpus_steward.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
